name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload
        uses: withastro/action@v3
        # Defaults:
        #   path: .
        #   node-version: 22
        #   package-manager: auto-detect

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Notifies Bing (and other IndexNow engines) of every URL after deploy.
      # The key is public by design — it must be served at
      # https://pastelloclub.com/212d551bc56643458e4bc872ae9c145c.txt
      # (committed as public/212d551bc56643458e4bc872ae9c145c.txt).
      - name: Ping IndexNow (Bing)
        env:
          INDEXNOW_KEY: 212d551bc56643458e4bc872ae9c145c
        run: |
          payload=$(python3 - <<EOF
          import json, os, re, urllib.request
          xml = urllib.request.urlopen('https://pastelloclub.com/sitemap-0.xml').read().decode()
          urls = re.findall(r'<loc>([^<]+)</loc>', xml)
          print(json.dumps({
              'host': 'pastelloclub.com',
              'key': os.environ['INDEXNOW_KEY'],
              'keyLocation': f'https://pastelloclub.com/{os.environ["INDEXNOW_KEY"]}.txt',
              'urlList': urls,
          }))
          EOF
          )
          echo "Pinging IndexNow for $(echo "$payload" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["urlList"]))') URLs..."
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "$payload" -w "HTTP %{http_code}\n"
